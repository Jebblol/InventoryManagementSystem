<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Inventory Management System — Class Diagram</title>
<style>
  body { margin: 0; padding: 20px; background: #0f172a; font-family: 'Segoe UI', Arial, sans-serif; }
  h1   { text-align: center; color: #38bdf8; margin-bottom: 6px; }
  p.sub{ text-align: center; color: #94a3b8; margin-bottom: 24px; font-size: .9rem; }
  .wrap{ overflow-x: auto; }

  /* Legend */
  .legend { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin-top:20px; }
  .leg    { display:flex; align-items:center; gap:6px; background:#1e293b; border:1px solid #334155;
            border-radius:6px; padding:6px 12px; color:#e2e8f0; font-size:.82rem; }
  .dot    { width:14px; height:14px; border-radius:3px; flex-shrink:0; }
</style>
</head>
<body>

<h1>Inventory Management System</h1>
<p class="sub">UML Class Diagram — Inheritance · Abstraction · Polymorphism · Encapsulation</p>

<div class="wrap">
<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="790" style="background:#1e293b;border-radius:12px;display:block;margin:0 auto;">
<defs>
  <!-- solid arrow -->
  <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0,10 3.5,0 7" fill="#64748b"/>
  </marker>
  <!-- open triangle (inheritance) -->
  <marker id="inh" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
    <polygon points="0 0,11 4.5,0 9" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  </marker>
  <!-- open triangle (implements) -->
  <marker id="imp" markerWidth="12" markerHeight="9" refX="11" refY="4.5" orient="auto">
    <polygon points="0 0,11 4.5,0 9" fill="#1e293b" stroke="#ec4899" stroke-width="1.5"/>
  </marker>
  <!-- open arrow (dependency) -->
  <marker id="dep" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polyline points="0 0,9 3.5,0 7" fill="none" stroke="#94a3b8" stroke-width="1.5"/>
  </marker>
</defs>

<!-- ═══════════════════ RELATIONSHIP LINES (drawn first, under boxes) ═══════════════════ -->

<!-- 1. Inheritance: Product --|> ExpiringProduct  (solid line, open triangle at child) -->
<line x1="232" y1="272" x2="258" y2="272" stroke="#22c55e" stroke-width="2" marker-end="url(#inh)"/>

<!-- 2. Implements: Searchable ..|> InventoryManager  (dashed, open triangle) -->
<line x1="530" y1="88" x2="598" y2="190" stroke="#ec4899" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#imp)"/>

<!-- 3. Uses: InventoryManager --> DatabaseManager -->
<line x1="718" y1="292" x2="740" y2="292" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

<!-- 4. Sorts with: InventoryManager --> ProductComparator -->
<line x1="852" y1="415" x2="852" y2="468" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

<!-- 5. Uses: MainGUI --> InventoryManager -->
<line x1="480" y1="562" x2="600" y2="415" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

<!-- 6. Creates (dashed): DatabaseManager ..> Product -->
<line x1="740" y1="240" x2="232" y2="240" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#dep)"/>

<!-- 7. Creates (dashed): DatabaseManager ..> ExpiringProduct -->
<line x1="740" y1="260" x2="462" y2="260" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#dep)"/>

<!-- 8. Launches: MainApp --> MainGUI -->
<line x1="230" y1="492" x2="258" y2="492" stroke="#64748b" stroke-width="2" marker-end="url(#arr)"/>

<!-- ═══════════════════ ARROW LABELS ═══════════════════ -->
<text x="235" y="268" fill="#22c55e"  font-size="10" font-family="Arial">extends</text>
<text x="540" y="138" fill="#ec4899"  font-size="10" font-family="Arial">implements</text>
<text x="719" y="288" fill="#94a3b8"  font-size="10" font-family="Arial">uses</text>
<text x="855" y="446" fill="#94a3b8"  font-size="10" font-family="Arial">sorts with</text>
<text x="520" y="498" fill="#94a3b8"  font-size="10" font-family="Arial">uses</text>
<text x="450" y="234" fill="#94a3b8"  font-size="10" font-family="Arial">creates</text>
<text x="448" y="256" fill="#94a3b8"  font-size="10" font-family="Arial">creates</text>
<text x="231" y="488" fill="#94a3b8"  font-size="10" font-family="Arial">launches</text>

<!-- ═══════════════════ CLASS BOXES ═══════════════════ -->

<!-- Helper macro via g: each box = outer rect + header rect + header text + divider + body lines -->

<!-- ── Searchable (interface) x=420 y=10 w=220 ── -->
<g>
  <rect x="420" y="10" width="220" height="78" rx="6" fill="#2d1b69" stroke="#a855f7" stroke-width="1.5"/>
  <rect x="420" y="10" width="220" height="26" rx="6" fill="#4c1d95"/>
  <rect x="420" y="26" width="220" height="10" fill="#4c1d95"/>
  <text x="530" y="27" text-anchor="middle" fill="#e9d5ff" font-size="11" font-family="Arial">«interface»</text>
  <text x="530" y="42" text-anchor="middle" fill="#f3e8ff" font-size="13" font-weight="bold" font-family="Arial">Searchable</text>
  <line x1="420" y1="48" x2="640" y2="48" stroke="#a855f7" stroke-width="1"/>
  <text x="428" y="62" fill="#c4b5fd" font-size="11" font-family="Arial">+searchById(id) : Product</text>
  <text x="428" y="78" fill="#c4b5fd" font-size="11" font-family="Arial">+searchByName(name) : List</text>
</g>

<!-- ── Product (base class) x=20 y=190 w=212 ── -->
<g>
  <rect x="20" y="190" width="212" height="200" rx="6" fill="#172554" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="20" y="190" width="212" height="28" rx="6" fill="#1e3a8a"/>
  <rect x="20" y="206" width="212" height="12" fill="#1e3a8a"/>
  <text x="126" y="207" text-anchor="middle" fill="#bfdbfe" font-size="11" font-family="Arial">«base class»</text>
  <text x="126" y="223" text-anchor="middle" fill="#dbeafe" font-size="13" font-weight="bold" font-family="Arial">Product</text>
  <line x1="20" y1="228" x2="232" y2="228" stroke="#3b82f6" stroke-width="1"/>
  <text x="28" y="242" fill="#93c5fd" font-size="11" font-family="Arial">- productId : String</text>
  <text x="28" y="257" fill="#93c5fd" font-size="11" font-family="Arial">- name : String</text>
  <text x="28" y="272" fill="#93c5fd" font-size="11" font-family="Arial">- category : String</text>
  <text x="28" y="287" fill="#93c5fd" font-size="11" font-family="Arial">- price : double</text>
  <text x="28" y="302" fill="#93c5fd" font-size="11" font-family="Arial">- quantity : int</text>
  <line x1="20" y1="310" x2="232" y2="310" stroke="#3b82f6" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="28" y="324" fill="#bfdbfe" font-size="11" font-family="Arial">+getters / setters</text>
  <text x="28" y="339" fill="#f59e0b" font-size="11" font-weight="bold" font-family="Arial">+getTotalValue() : double</text>
  <text x="28" y="354" fill="#bfdbfe" font-size="11" font-family="Arial">+toString() : String</text>
  <text x="28" y="376" fill="#fde68a" font-size="9.5" font-family="Arial" font-style="italic">* getTotalValue = price x qty</text>
</g>

<!-- ── ExpiringProduct x=258 y=190 w=204 ── -->
<g>
  <rect x="258" y="190" width="204" height="168" rx="6" fill="#172554" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="258" y="190" width="204" height="28" rx="6" fill="#1e3a8a"/>
  <rect x="258" y="206" width="204" height="12" fill="#1e3a8a"/>
  <text x="360" y="207" text-anchor="middle" fill="#bfdbfe" font-size="11" font-family="Arial">«subclass»</text>
  <text x="360" y="223" text-anchor="middle" fill="#dbeafe" font-size="13" font-weight="bold" font-family="Arial">ExpiringProduct</text>
  <line x1="258" y1="228" x2="462" y2="228" stroke="#3b82f6" stroke-width="1"/>
  <text x="266" y="242" fill="#93c5fd" font-size="11" font-family="Arial">- expiryDate : String</text>
  <line x1="258" y1="250" x2="462" y2="250" stroke="#3b82f6" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="266" y="264" fill="#bfdbfe" font-size="11" font-family="Arial">+getExpiryDate() : String</text>
  <text x="266" y="279" fill="#bfdbfe" font-size="11" font-family="Arial">+setExpiryDate(date)</text>
  <text x="266" y="294" fill="#f59e0b" font-size="11" font-weight="bold" font-family="Arial">+getTotalValue() : double</text>
  <text x="266" y="313" fill="#fde68a" font-size="9.5" font-family="Arial" font-style="italic">* price x qty x 0.80 (20% off)</text>
  <text x="266" y="327" fill="#fde68a" font-size="9.5" font-family="Arial" font-style="italic">* POLYMORPHISM — overrides</text>
  <text x="266" y="341" fill="#fde68a" font-size="9.5" font-family="Arial" font-style="italic">  parent getTotalValue()</text>
</g>

<!-- ── InventoryManager x=480 y=190 w=238 ── -->
<g>
  <rect x="480" y="190" width="238" height="225" rx="6" fill="#052e16" stroke="#22c55e" stroke-width="1.5"/>
  <rect x="480" y="190" width="238" height="28" rx="6" fill="#14532d"/>
  <rect x="480" y="206" width="238" height="12" fill="#14532d"/>
  <text x="599" y="207" text-anchor="middle" fill="#bbf7d0" font-size="11" font-family="Arial">«implements Searchable»</text>
  <text x="599" y="223" text-anchor="middle" fill="#dcfce7" font-size="13" font-weight="bold" font-family="Arial">InventoryManager</text>
  <line x1="480" y1="228" x2="718" y2="228" stroke="#22c55e" stroke-width="1"/>
  <text x="488" y="242" fill="#86efac" font-size="11" font-family="Arial">- productList : ArrayList</text>
  <text x="488" y="257" fill="#86efac" font-size="11" font-family="Arial">- productMap : HashMap</text>
  <text x="488" y="272" fill="#86efac" font-size="11" font-family="Arial">- dbManager : DatabaseManager</text>
  <line x1="480" y1="280" x2="718" y2="280" stroke="#22c55e" stroke-width="0.8" stroke-dasharray="4,3"/>
  <text x="488" y="294" fill="#bbf7d0" font-size="11" font-family="Arial">+loadFromDatabase()</text>
  <text x="488" y="309" fill="#bbf7d0" font-size="11" font-family="Arial">+addProduct(p) : boolean</text>
  <text x="488" y="324" fill="#bbf7d0" font-size="11" font-family="Arial">+updateProduct(p) : boolean</text>
  <text x="488" y="339" fill="#bbf7d0" font-size="11" font-family="Arial">+deleteProduct(id) : boolean</text>
  <text x="488" y="354" fill="#bbf7d0" font-size="11" font-family="Arial">+searchById(id) : Product</text>
  <text x="488" y="369" fill="#bbf7d0" font-size="11" font-family="Arial">+searchByName(name) : List</text>
  <text x="488" y="384" fill="#bbf7d0" font-size="11" font-family="Arial">+sortByName() / sortByPrice()</text>
  <text x="488" y="403" fill="#fde68a" font-size="9.5" font-family="Arial" font-style="italic">* LINEAR SEARCH in searchByName()</text>
</g>

<!-- ── DatabaseManager x=740 y=190 w=230 ── -->
<g>
  <rect x="740" y="190" width="230" height="198" rx="6" fill="#172554" stroke="#3b82f6" stroke-width="1.5"/>
  <rect x="740" y="190" width="230" height="28" rx="6" fill="#1e3a8a"/>
  <rect x="740" y="206" width="230" height="12" fill="#1e3a8a"/>

  <line x1="740" y1="228" x2="970" y2="228" stroke="#3b82f6" stroke-width="1"/>

  <line x1="740" y1="280" x2="970" y2="280" stroke="#3b82f6" stroke-width="0.8" stroke-dasharray="4,3"/>

  <text x="748" y="309" fill="#bfdbfe" font-size="11" font-family="Arial">+getAllProducts() : List</text>
  <text x="748" y="324" fill="#bfdbfe" font-size="11" font-family="Arial">+getProductById(id) : Product</text>
  <text x="748" y="339" fill="#bfdbfe" font-size="11" font-family="Arial">+insertProduct(p) : boolean</text>
  <text x="748" y="354" fill="#bfdbfe" font-size="11" font-family="Arial">+updateProduct(p) : boolean</text>
  <text x="748" y="369" fill="#bfdbfe" font-size="11" font-family="Arial">+deleteProduct(id) : boolean</text>

<g>

  <rect x="740" y="468" width="230" height="28" rx="6" fill="#1e3a8a"/>
  <rect x="740" y="484" width="230" height="12" fill="#1e3a8a"/>

  <text x="748" y="535" fill="#bfdbfe" font-size="11" font-family="Arial">+byPrice() : Comparator</text>
</g>

<g>

<div class="legend">
